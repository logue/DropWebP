[package]
name = "drop-compress-image"
version = "2.3.0"
authors = ["Logue"]
edition = "2024"
rust-version = "1.90.0"
description = "Drop Compress Image is a desktop application that converts images to WebP/Avif/JPEG XL format using drag-and-drop functionality. Built with Vite, Vue 3, TypeScript, and Tauri."
readme = "../../ReadMe.md"
repository = "https://github.com/logue/DropWebP"
license-file = "../../LICENSE"
keywords = [
  "tauri",
  "webp",
  "avif",
  "jpeg",
  "jpeg-xl",
  "image",
  "compress",
  "converter",
  "desktop",
  "application",
]
categories = ["image-processing", "gui"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "drop_compress_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2.43"
pkg-config = "0.3.32"
tauri-build = { version = "2.5.1", features = [] }
vcpkg = "0.2.15"

[dependencies]
bytemuck = "1.24.0"
chrono = { version = "0.4.42", features = ["serde"] }
flate2 = "1.1.5"
image = "0.25.8"
imgref = "1.12.0"
indexmap = "2.12.0"
jpeg2k = "0.10.1"
jpegxl-rs = { version = "0.11.2+libjxl-0.11.1", features = [] }
kamadak-exif = "0.6.1"
libheif-rs = "2.5.1"
libwebp-sys2 = { version = "0.2.0", features = ["1_5"] }
mozjpeg = "0.10.13"
openjpeg-sys = "1.0.12"
oxipng = "9.1.3"
png = "0.18.0"
ravif = "0.12.0"
rgb = "0.8.52"
serde = "1.0.219"
serde_json = "1.0.145"
tauri = { version = "2.9.1", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2.4.4"
tauri-plugin-log = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.2"
tauri-plugin-os = "2"
thiserror = "2.0.17"
