[package]
name = "drop-compress-image"
version = "3.2.0"
authors = ["Logue"]
edition = "2024"
rust-version = "1.92.0"
description = "Drop Compress Image is a desktop application that converts images to WebP/Avif/JPEG XL format using drag-and-drop functionality. Built with Vite, Vue 3, TypeScript, and Tauri."
readme = "../../ReadMe.md"
repository = "https://github.com/logue/DropWebP"
homepage = "https://logue.dev/DropWebP/"
license-file = "../../LICENSE"
keywords = [
  "application",
  "avif",
  "compress",
  "converter",
  "desktop",
  "image",
  "jpeg-xl",
  "jpeg",
  "jpeg2000",
  "jpegli",
  "oxipng",
  "png",
  "tauri",
  "webp",
  "zopfli",
]
categories = ["image-processing", "gui"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "drop_compress_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2.49"
pkg-config = "0.3.32"
tauri-build = { version = "2.5.3", features = [] }
vcpkg = "0.2.15"

[dependencies]
bytemuck = "1.24.0"
chrono = { version = "0.4.42", features = ["serde"] }
flate2 = "1.1.5"
image = "0.25.9"
imgref = "1.12.0"
indexmap = "2.12.1"
jpeg2k = "0.10.1"
jpegli = "0.1.0"
jpegxl-rs = { version = "0.11.2+libjxl-0.11.1" }
kamadak-exif = "0.6.1"
libavif-sys = { version = "0.17.0", default-features = false, features = [
  "codec-aom",
] }
libwebp-sys = "0.14.1"
openjpeg-sys = "1.0.12" # Note: Requires system openjpeg or Homebrew
oxipng = "10.0.0"
png = "0.18.0"
rgb = "0.8.52"
serde = "1.0.228"
serde_json = "1.0.147"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2.4.4"
tauri-plugin-log = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.2"
tauri-plugin-os = "2.3.2"
tempfile = "3.24.0"
thiserror = "2.0.17"

[dev-dependencies]
glib = "0.21.5"

[profile.release]
lto = "thin"       # Thin LTO (互換性重視)
codegen-units = 16 # 並列コンパイルで互換性向上
panic = "abort"    # 高速パニック処理
strip = true       # シンボル除去
opt-level = 3      # 速度最適化（互換性重視）

# Windows 固有の最適化
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
] }

# macOS 固有の最適化
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc = "0.2.7"

# Apple Silicon (ARM64) 向けの設定
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-a14"] # Apple Silicon互換性向上

# Linux 固有の最適化
[target.'cfg(unix)'.dependencies]
nix = "0.30.1"
