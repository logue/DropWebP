[env]
# vcpkgでインストールされたlibjxlを使用するための設定
VCPKG_ROOT = "C:\\Users\\db-001\\Documents\\vcpkg"
VCPKGRS_DYNAMIC = "1"
VCPKGRS_TRIPLET = "x64-windows"

# jpegxl vendored build用の設定
# CMakeに/MDフラグを使用させる（動的CRT）
CXXFLAGS = "/MD"
CFLAGS = "/MD"

# Windows開発モードでのSTATUS_BREAKPOINT対策
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:NONE"]
