packages:
  - frontend
  - docs

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

onlyBuiltDependencies:
  - "@parcel/watcher"
  - better-sqlite3
  - core-js
  - esbuild
  - unrs-resolver
  - vue-demi

overrides:
  js-cookie@<=3.0.5: 3.0.7
