packages:
  - frontend
  - docs

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@eslint/plugin-kit@0.7.2'
  - eslint-plugin-yml@3.4.0
  - eslint@10.4.1
  - '@vue/language-core@3.3.3'
  - lint-staged@17.0.6
  - vue-tsc@3.3.3

onlyBuiltDependencies:
  - "@parcel/watcher"
  - better-sqlite3
  - core-js
  - esbuild
  - unrs-resolver
  - vue-demi

overrides:
  js-cookie@<=3.0.5: 3.0.7
