[package]
name = "drop-compress-image"
version = "3.4.0"
authors = ["Logue"]
edition = "2024"
rust-version = "1.95.0"
description = "Drop Compress Image is a desktop application that converts images to WebP/Avif/JPEG XL format using drag-and-drop functionality. Built with Vite, Vue 3, TypeScript, and Tauri."
readme = "../../ReadMe.md"
repository = "https://github.com/logue/DropWebP"
homepage = "https://logue.dev/DropWebP/"
license-file = "../../LICENSE"
keywords = [
  "application",
  "avif",
  "compress",
  "converter",
  "desktop",
  "image",
  "jpeg-xl",
  "jpeg",
  "jpeg2000",
  "jpegli",
  "oxipng",
  "png",
  "tauri",
  "webp",
  "zopfli",
]
categories = ["image-processing", "gui"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "drop_compress_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2.61"
pkg-config = "0.3.32"
tauri-build = { version = "2.6.0", features = [] }
vcpkg = "0.2.15"

[dependencies]
bytemuck = "1.25.0"
jiff = { version = "0.2.24", features = ["serde"] }
flate2 = "1.1.9"
image = "0.25.9"
imgref = "1.12.1"
indexmap = "2.14.0"
jpeg2k = "0.10.1"
jpegli_rs = { version = "0.12.0", package = "jpegli-rs", default-features = false, features = [
  "std",
  "cms-lcms2",
] } # Pure Rust JPEG encoder with perceptual optimizations
# Note: jxl-sys requires LLVM/Clang for bindgen on Windows
# Install from: https://github.com/llvm/llvm-project/releases (e.g., LLVM-19.1.6-win64.exe)
# Or install via winget: winget install LLVM.LLVM
jxl-sys = "0.1.10"     # MIT/Apache-2.0 FFI bindings to libjxl (BSD-3-Clause)
kamadak-exif = "0.6.1"
lcms2 = "6.1.1"        # Little CMS color management, linked via vcpkg
# AVIF encoder: Using rav1e (pure Rust AV1 encoder) instead of codec-aom
# Rationale: libaom requires NASM with multipass optimization support on Windows,
# which can cause build failures depending on NASM version and CMake configuration.
# rav1e is written in Rust, builds reliably across all platforms (Windows/macOS/Linux),
# and provides comparable quality to libaom while avoiding native build dependencies.
libavif-sys = { version = "0.17.0", default-features = false, features = [
  "codec-rav1e",
] }
libwebp-sys = "0.14.2" # WebP codec, linked via vcpkg
openjpeg-sys = "1.0.12" # JPEG 2000 decoder, linked via vcpkg
oxipng = "10.1.0"
png = "0.18.1"
rgb = "0.8.53"
serde = "1.0.228"
serde_json = "1.0.149"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.3"
tauri-plugin-os = "2.3.2"
tempfile = "3.27.0"
thiserror = "2.0.18"
# ultrahdr = { version = "0.1.3", default-features = true } # Ultra HDR (JPEG-R with gainmap) support - 将来の実装用

[dev-dependencies]
glib = "0.22.7"

[profile.release]
lto = "thin"       # Thin LTO (互換性重視)
codegen-units = 16 # 並列コンパイルで互換性向上
panic = "abort"    # 高速パニック処理
strip = true       # シンボル除去
opt-level = 3      # 速度最適化（互換性重視）

# Windows 固有の最適化
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
] }

# macOS 固有の最適化
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc = "0.2.7"

# Apple Silicon (ARM64) 向けの設定
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "target-cpu=apple-a14"] # Apple Silicon互換性向上

# Linux 固有の最適化
[target.'cfg(unix)'.dependencies]
nix = "0.31.2"
